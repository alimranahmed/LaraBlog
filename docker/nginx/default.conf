map $http_cf_connecting_ip $livewire_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $livewire_limit_key zone=livewire_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Instantly drop sensitive files & scan targets without invoking PHP
    location ~* /(vendor|composer\.(json|lock)|yarn\.lock|package\.json|phpunit|\.git|\.env|\.npmrc) {
        return 444;
    }

    # Drop common WordPress / CMS probes
    location ~* /(wp-admin|wp-content|wp-includes|xmlrpc\.php|\.aws|\.kube|phpmyadmin) {
        return 444;
    }

    # Deny access to other hidden files (except .well-known) before PHP handling
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Rate limit Livewire updates
    location /livewire/update {
        limit_req zone=livewire_limit burst=15 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Increase buffer sizes for Laravel
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Client body size limit
    client_max_body_size 20M;
}
